name: Pages

# Publishes the demo, so the README can link to examples you can tap:
# https://seukwoo.github.io/nudg/demo/

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}demo/
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Assemble the site
        # The demo loads ../dist and ../examples, so they keep their places.
        run: |
          mkdir _site
          cp -r demo examples dist _site/
          printf '<!doctype html><meta http-equiv="refresh" content="0; url=demo/">\n' > _site/index.html
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v5
