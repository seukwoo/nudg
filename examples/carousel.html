<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Carousel</title>
  <style>
    .carousel { width: 200px; font: 14px ui-sans-serif, system-ui, sans-serif; }
    .carousel .viewport { overflow: hidden; border-radius: 12px; cursor: grab; }
    .carousel .strip { display: flex; width: 600px; }
    .carousel .slide {
      display: grid;
      place-items: center;
      width: 200px;
      height: 100px;
      color: #fff;
      font-weight: 600;
      user-select: none;
    }
    .carousel .slide:nth-child(1) { background: #2563eb; }
    .carousel .slide:nth-child(2) { background: #16a34a; }
    .carousel .slide:nth-child(3) { background: #db2777; }
    .carousel .dots { display: flex; justify-content: center; gap: 8px; padding-top: 10px; }
    .carousel .dots button {
      width: 8px;
      height: 8px;
      padding: 0;
      border: 0;
      border-radius: 50%;
      background: #1c1c1a;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }
  </style>
</head>
<body>
  <div class="carousel">
    <div class="viewport">
      <div class="strip" data-nudg="strip"><div class="slide">One</div><div class="slide">Two</div><div class="slide">Three</div></div>
    </div>
    <div class="dots">
      <button type="button" data-nudg="dot1" aria-label="Slide 1"></button>
      <button type="button" data-nudg="dot2" aria-label="Slide 2"></button>
      <button type="button" data-nudg="dot3" aria-label="Slide 3"></button>
    </div>
  </div>
  <!-- Host markup for carousel.nudg.json. Serve the repo and build first to try it live. -->
  <script type="module">
    import { compileUrl, play } from "../dist/dom/index.js";
    const { program } = await compileUrl("./carousel.nudg.json");
    play(program, document.body);
  </script>
</body>
</html>
