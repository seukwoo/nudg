<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Dialog</title>
  <style>
    .dialog-demo { position: relative; width: 260px; height: 170px; overflow: hidden; border-radius: 12px; background: #f6f6f4; font: 14px ui-sans-serif, system-ui, sans-serif; }
    .dialog-demo .opener { position: absolute; top: 12px; left: 12px; padding: 8px 12px; border: 1px solid #e4e4df; border-radius: 8px; background: #fff; font: inherit; cursor: pointer; }
    .dialog-demo .scrim { position: absolute; inset: 0; background: #000; }
    /* nudg owns opacity and scale; CSS centers the dialog. */
    .dialog-demo .dialog {
      position: absolute;
      left: 20px;
      right: 20px;
      top: 36px;
      padding: 14px 16px;
      border-radius: 12px;
      background: #fff;
      box-shadow: 0 10px 30px rgb(0 0 0 / 0.2);
      transform-origin: 50% 50%;
    }
    .dialog-demo .dialog h2 { margin: 0 0 4px; font-size: 15px; }
    .dialog-demo .dialog p { margin: 0 0 10px; color: #6b6b66; font-size: 13px; }
    .dialog-demo .close { padding: 7px 12px; border: 0; border-radius: 8px; background: #1c1c1a; color: #fff; font: inherit; cursor: pointer; }
    .dialog-demo .close:focus-visible { outline: 3px solid #93c5fd; outline-offset: 2px; }
    /* Closed: out of the way of the opener. nudg's state attribute says which. */
    .dialog-demo .scrim[data-nudg-state~="closed"], .dialog-demo .dialog[data-nudg-state~="closed"] { pointer-events: none; }
  </style>
</head>
<body>
  <div class="dialog-demo">
    <button type="button" class="opener" data-nudg="opener">Delete file…</button>
    <div class="scrim" data-nudg="scrim"></div>
    <div class="dialog" data-nudg="dialog" role="dialog" aria-modal="true" aria-labelledby="dlg-title" tabindex="-1">
      <h2 id="dlg-title">Delete this file?</h2>
      <p>This can't be undone. Press Escape to keep it.</p>
      <button type="button" class="close" data-nudg="close">Keep it</button>
    </div>
  </div>
  <!-- Host markup for dialog.nudg.json. The app moves focus into the dialog when it opens. -->
  <script type="module">
    import { compileUrl, play } from "../dist/dom/index.js";
    const { program } = await compileUrl("./dialog.nudg.json");
    const dialog = document.querySelector("[role=dialog]");
    const opener = document.querySelector(".opener");
    play(program, document.body, {
      onState: (state) => (state.includes("open") ? dialog.querySelector(".close") : opener).focus({ preventScroll: true }),
    });
  </script>
</body>
</html>
