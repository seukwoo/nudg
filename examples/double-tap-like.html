<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Double-tap like</title>
  <style>
    .photo { position: relative; display: grid; place-items: center; width: 200px; height: 150px; border-radius: 14px; background: linear-gradient(135deg, #f59e0b, #db2777 60%, #7c3aed); box-shadow: 0 6px 20px rgb(0 0 0 / 0.15); cursor: pointer; user-select: none; -webkit-tap-highlight-color: transparent; }
    .photo svg { width: 72px; height: 72px; fill: #fff; filter: drop-shadow(0 2px 6px rgb(0 0 0 / 0.25)); pointer-events: none; }
    .photo-caption { margin-top: 8px; font: 12px ui-sans-serif, system-ui, sans-serif; color: #6b6b66; text-align: center; }
  </style>
</head>
<body>
  <div>
    <div class="photo" role="button" tabindex="0" aria-label="Photo. Double-tap to like, hold to peek." data-nudg="photo">
      <svg viewBox="0 0 24 24" aria-hidden="true" data-nudg="heart"><path d="M12 21s-7.4-4.5-9.9-9.2C.5 8.5 2.4 4 6.5 4c2.3 0 3.9 1.3 5.5 3.2C13.6 5.3 15.2 4 17.5 4c4.1 0 6 4.5 4.4 7.8C19.4 16.5 12 21 12 21z"/></svg>
    </div>
    <div class="photo-caption">Double-tap to like · hold to peek</div>
  </div>
  <!-- Host markup for double-tap-like.nudg.json. The app stores the like and offers the same actions from the keyboard and to assistive technology. -->
  <script type="module">
    import { compileUrl, play } from "../dist/dom/index.js";
    const { program } = await compileUrl("./double-tap-like.nudg.json");
    play(program, document.body);
  </script>
</body>
</html>
