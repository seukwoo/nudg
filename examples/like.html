<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Like</title>
  <style>
    .stage { display: grid; place-items: center; width: 96px; height: 96px; }
    .like { padding: 0; border: 0; background: none; line-height: 0; }
    .like svg { width: 48px; height: 48px; fill: #9ca3af; cursor: pointer; }
  </style>
</head>
<body>
  <div class="stage">
    <button class="like" aria-label="Like"><svg data-nudg="heart" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 21s-7.4-4.5-9.9-9.2C.5 8.5 2.4 4 6.5 4c2.3 0 3.9 1.3 5.5 3.2C13.6 5.3 15.2 4 17.5 4c4.1 0 6 4.5 4.4 7.8C19.4 16.5 12 21 12 21z"/></svg></button>
  </div>
  <!-- Host markup for like.nudg.json. Serve the repo and build first to try it live. -->
  <script type="module">
    import { compileUrl, play } from "../dist/dom/index.js";
    const { program } = await compileUrl("./like.nudg.json");
    play(program, document.body);
  </script>
</body>
</html>
