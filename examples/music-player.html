<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Music player</title>
  <style>
    body { margin: 0; min-height: 220px; display: grid; place-items: center; background: #eef2ef; color: #17231f; font: 12px ui-sans-serif, system-ui, sans-serif; }
    .music-player { width: min(304px, 100%); box-sizing: border-box; display: grid; grid-template-columns: 88px minmax(0, 1fr); gap: 12px; padding: 12px; border: 1px solid #d7ded9; border-radius: 8px; background: #fff; box-shadow: 0 8px 24px rgba(27, 48, 40, .1); }
    .artwork-wrap { position: relative; width: 88px; aspect-ratio: 1; overflow: hidden; border-radius: 6px; background: #143832; }
    .artwork { width: 100%; height: 100%; object-fit: cover; transform-origin: center; }
    .artwork-status { position: absolute; inset: auto 6px 6px; padding: 3px 5px; border-radius: 4px; color: #fff; background: rgba(14, 32, 27, .82); font-size: 9px; font-weight: 750; }
    .content { min-width: 0; display: grid; align-content: center; gap: 7px; }
    .meta strong, .meta span { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .meta strong { font-size: 14px; }
    .meta span { margin-top: 2px; color: #66716b; }
    .timeline { position: relative; height: 14px; display: grid; align-items: center; }
    .track, .buffered, .progress { position: absolute; left: 0; width: 100%; height: 4px; border-radius: 2px; transform-origin: left center; pointer-events: none; }
    .track { background: #e4e9e5; }
    .buffered { background: #b8c7bf; }
    .progress { background: #1b7d67; }
    .media-seek { position: absolute; inset: 0; width: 100%; height: 14px; margin: 0; opacity: 0; cursor: pointer; }
    .time { display: flex; justify-content: space-between; color: #6d756f; font: 10px ui-monospace, "SF Mono", Menlo, monospace; font-variant-numeric: tabular-nums; }
    .controls { display: grid; grid-template-columns: 28px 34px 28px 28px 28px; gap: 5px; align-items: center; }
    button { position: relative; width: 28px; height: 28px; display: grid; place-items: center; padding: 0; border: 1px solid #d9e0db; border-radius: 6px; color: #21302a; background: #f4f7f5; font: inherit; font-weight: 800; cursor: pointer; }
    .media-toggle { width: 34px; height: 34px; border-color: #1b7d67; color: #fff; background: #1b7d67; font-size: 13px; }
    button[aria-pressed="true"] { border-color: #dc9d37; color: #805610; background: #fff4d8; }
    .secondary { grid-column: 1 / -1; display: grid; grid-template-columns: 28px 1fr 54px; gap: 7px; align-items: center; }
    .media-volume { min-width: 0; width: 100%; accent-color: #1b7d67; }
    .media-rate { width: 54px; height: 28px; border: 1px solid #d9e0db; border-radius: 6px; color: #29352f; background: #fff; font: inherit; }
    .stop-icon { width: 10px; height: 10px; border-radius: 1px; background: currentColor; }
    .speaker-icon { position: relative; width: 15px; height: 14px; display: block; }
    .speaker-icon::before { content: ""; position: absolute; left: 1px; top: 5px; width: 5px; height: 5px; border-radius: 1px; background: currentColor; }
    .speaker-icon::after { content: ""; position: absolute; left: 5px; top: 2px; width: 8px; height: 11px; background: currentColor; clip-path: polygon(0 30%, 100% 0, 100% 100%, 0 70%); }
    .media-mute::before { content: ""; position: absolute; right: 3px; width: 5px; height: 9px; border-right: 2px solid currentColor; border-radius: 50%; }
    .media-mute[aria-pressed="true"]::before { display: none; }
    .media-mute[aria-pressed="true"]::after { content: ""; position: absolute; width: 17px; border-top: 2px solid currentColor; transform: rotate(45deg); }
  </style>
</head>
<body>
  <section class="music-player media-shell" aria-label="Music player">
    <div class="artwork-wrap">
      <img class="artwork" data-nudg="artwork" src="../examples/media/afterglow-cover.png" alt="Afterglow album cover">
      <output class="artwork-status" data-nudg="status" aria-live="polite">Ready</output>
    </div>
    <div class="content">
      <div class="meta"><strong>Afterglow</strong><span>North Window</span></div>
      <div>
        <div class="timeline">
          <span class="track"></span><span class="buffered" data-nudg="buffered"></span><span class="progress" data-nudg="progress"></span>
          <input class="media-seek" type="range" min="0" max="0" value="0" aria-label="Seek">
        </div>
        <div class="time"><span class="media-current">00:00</span><span class="media-duration">00:00</span></div>
      </div>
      <div class="controls">
        <button class="media-back" type="button" aria-label="Back 10 seconds">-10</button>
        <button class="media-toggle" data-nudg="play" type="button" aria-label="Play">&#9654;</button>
        <button class="media-stop" type="button" aria-label="Stop"><span class="stop-icon" aria-hidden="true"></span></button>
        <button class="media-forward" type="button" aria-label="Forward 10 seconds">+10</button>
        <button class="media-repeat" data-nudg="repeat" type="button" aria-label="Repeat" aria-pressed="false">&#8635;</button>
      </div>
      <div class="secondary">
        <button class="media-mute" data-nudg="mute" type="button" aria-label="Mute" aria-pressed="false"><span class="speaker-icon" aria-hidden="true"></span></button>
        <input class="media-volume" type="range" min="0" max="1" step="0.05" value="1" aria-label="Volume">
        <select class="media-rate" aria-label="Playback speed"><option value="0.75">0.75x</option><option value="1" selected>1x</option><option value="1.25">1.25x</option><option value="1.5">1.5x</option></select>
      </div>
    </div>
    <audio preload="metadata" src="../examples/media/afterglow.mp3"></audio>
  </section>
  <script type="module">
    import { compileUrl, play } from "../dist/dom/index.js";
    import { createMediaController } from "./media-host.js";
    const { program } = await compileUrl("./music-player.nudg.json");
    const root = document.querySelector(".music-player");
    const player = play(program, document.body, {
      onState(state) {
        const has = (name) => state.some((path) => path === name || path.endsWith(`/${name}`));
        root.querySelector(".artwork-status").value = has("playing") ? "Playing" : has("stopped") ? "Stopped" : has("ended") ? "Ended" : has("loading") || has("buffering") ? "Loading" : "Paused";
      },
    });
    const media = createMediaController(root.querySelector("audio"), player, root);
    addEventListener("beforeunload", () => media.dispose(), { once: true });
  </script>
</body>
</html>
