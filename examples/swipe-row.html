<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Swipe row</title>
  <style>
    .list { width: 320px; padding: 8px 0; font: 15px/1.4 ui-sans-serif, system-ui, sans-serif; }
    .row { position: relative; height: 56px; overflow: hidden; border-radius: 10px; background: #ef4444; }
    .action { position: absolute; inset: 0 0 0 auto; width: 88px; border: 0; background: none; color: #fff; font: inherit; font-weight: 600; cursor: pointer; }
    .content { position: absolute; inset: 0; display: flex; align-items: center; padding: 0 16px; background: #fff; border: 1px solid #e4e4df; border-radius: 10px; cursor: grab; user-select: none; }
  </style>
</head>
<body>
  <div class="list">
    <div class="row" data-nudg="row">
      <button class="action" data-nudg="action">Delete</button>
      <div class="content" data-nudg="content">Swipe me left</div>
    </div>
  </div>
  <!-- Host markup for swipe-row.nudg.json. Serve the repo and build first to try it live. -->
  <script type="module">
    import { compileUrl, play } from "../dist/dom/index.js";
    const { program } = await compileUrl("./swipe-row.nudg.json");
    play(program, document.body);
  </script>
</body>
</html>
