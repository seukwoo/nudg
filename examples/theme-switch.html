<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Theme switch</title>
  <style>
    .theme-demo { --surface: #ffffff; --hover: #f3f4f6; --track: #d1d5db; --accent: #6366f1; --text: #1c1c1a; --muted: #6b7280; font: 13px ui-sans-serif, system-ui, sans-serif; }
    .theme-demo.dark { --surface: #18181b; --hover: #27272a; --track: #3f3f46; --accent: #a78bfa; --text: #f4f4f5; --muted: #a1a1aa; }
    .theme-demo .panel { width: 280px; padding: 8px; border-radius: 14px; box-shadow: 0 1px 3px #0000001f, 0 6px 16px #00000014; color: var(--text); }
    .theme-demo .row { display: flex; align-items: center; justify-content: space-between; padding: 12px; border-radius: 10px; }
    .theme-demo .row small { display: block; color: var(--muted); }
    .theme-demo .track { width: 44px; height: 24px; padding: 2px; box-sizing: border-box; border: 0; border-radius: 12px; cursor: pointer; -webkit-tap-highlight-color: transparent; }
    .theme-demo .knob { display: block; width: 20px; height: 20px; border-radius: 50%; background: #fff; box-shadow: 0 1px 2px #00000040; }
    .theme-demo .sound { margin-top: 10px; padding: 6px 10px; border: 0; border-radius: 8px; background: #f3f4f6; font: inherit; cursor: pointer; }
  </style>
</head>
<body>
  <div class="theme-demo">
    <div class="panel" data-nudg="panel">
      <div class="row" data-nudg="row1"><span>Dark mode<small>Follows this switch</small></span><button class="track" role="switch" aria-checked="false" aria-label="Dark mode" data-nudg="track"><span class="knob" data-nudg="knob"></span></button></div>
      <div class="row" data-nudg="row2"><span>Notifications<small>Hover a row: the tint is the theme's</small></span></div>
    </div>
    <button class="sound" aria-pressed="false">Sound off</button>
  </div>
  <!-- Host markup for theme-switch.nudg.json. The colors are CSS variables the page already has (--surface, --hover, --track, --accent); the page switches the theme class, and nudg reads the new values and moves to them. -->
  <script type="module">
    import { compileUrl, play } from "../dist/dom/index.js";
    const { program } = await compileUrl("./theme-switch.nudg.json");
    const app = document.querySelector(".theme-demo");
    const track = document.querySelector(".track");
    const options = {
      sounds: { tick: "./sounds/tick.wav" },
      sound: false,
      onState: (state) => {
        const dark = state.includes("dark/on");
        app.classList.toggle("dark", dark);
        track.setAttribute("aria-checked", String(dark));
      },
    };
    play(program, document.body, options);
    const sound = document.querySelector(".sound");
    sound.addEventListener("click", () => {
      options.sound = !options.sound;
      sound.setAttribute("aria-pressed", String(options.sound));
      sound.textContent = options.sound ? "Sound on" : "Sound off";
    });
  </script>
</body>
</html>
