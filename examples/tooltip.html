<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Tooltip</title>
  <style>
    .tooltip-demo { position: relative; display: inline-block; padding-top: 44px; font: 14px ui-sans-serif, system-ui, sans-serif; }
    .tooltip-demo .trigger {
      padding: 9px 14px;
      border: 1px solid #e4e4df;
      border-radius: 8px;
      background: #fff;
      font: inherit;
      cursor: default;
    }
    .tooltip-demo .trigger:focus-visible { outline: 3px solid #93c5fd; outline-offset: 2px; }
    /* nudg owns opacity, y and scale; CSS places the tip above the trigger. */
    .tooltip-demo .tip {
      position: absolute;
      left: 50%;
      top: 0;
      margin: 0 0 0 -60px;
      width: 120px;
      padding: 6px 10px;
      border-radius: 6px;
      background: #1c1c1a;
      color: #fff;
      font-size: 12px;
      text-align: center;
      pointer-events: none;
      transform-origin: 50% 100%;
    }
  </style>
</head>
<body>
  <div class="tooltip-demo">
    <div class="tip" data-nudg="tip" role="tooltip" id="tip-1">Saves to the cloud</div>
    <button type="button" class="trigger" data-nudg="trigger" aria-describedby="tip-1">Hover or focus me</button>
  </div>
  <!-- Host markup for tooltip.nudg.json. Serve the repo and build first to try it live. -->
  <script type="module">
    import { compileUrl, play } from "../dist/dom/index.js";
    const { program } = await compileUrl("./tooltip.nudg.json");
    play(program, document.body);
  </script>
</body>
</html>
